---
# Internal DNS record for Pi-hole - points to internal gateway IP.
#
# Without this, LAN clients resolved ntfy-obs.kalde.in through the public
# CNAME chain (ntfy-obs -> external-obs -> *.cfargotunnel.com), and
# cfargotunnel.com's only address record is Cloudflare's placeholder ULA
# fd10:aec2:5dae::, which is not routable from the LAN. IPv4-only clients
# got "Network is unreachable" whenever the AAAA leg won. A local A record
# makes Pi-hole authoritative for this name, so AAAA is NODATA. See #68.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ntfy-pihole
  namespace: observability
  labels:
    external-dns.io/provider: pihole
spec:
  endpoints:
    - dnsName: ntfy-obs.kalde.in
      recordTTL: 300
      recordType: A
      targets:
        - 192.168.10.242  # Internal Gateway IP
