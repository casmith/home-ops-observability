# Alertmanager notification config.
#
# ntfy and Discord run in parallel during the ntfy soak period. Both live in a
# single receiver on purpose: Alertmanager fans a receiver's integrations out
# independently, each with its own retry pipeline, and the notification log
# records delivery per integration. So a failing ntfy neither blocks Discord
# nor suppresses it through dedup.
#
# Retire Discord by deleting the slack_configs block below once ntfy has proven
# itself. See the "Exit criteria" note in PR #56.
#
# ntfy formatting and priority come from the obs-alert template in
# observability/ntfy/app/configmap-templates.yaml.
#
# NOTE: the basic_auth password is NTFY_PUBLISHER_PASSWORD from
# observability/ntfy/app/secret.sops.yaml. Change both together.
#
# Encrypt with: sops -e -i alertmanager-config.sops.yaml
