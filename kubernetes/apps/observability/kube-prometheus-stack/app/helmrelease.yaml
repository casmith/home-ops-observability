---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  values:
    cleanPrometheusOperatorObjectNames: true

    # Disable scraping of the observability cluster's kube components (we're monitoring the main cluster)
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # Prometheus configuration
    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus-obs.kalde.in
        retention: 90d
        retentionSize: 450GB

        # Accept pushed samples at /api/v1/write. Off by default, and required
        # by the Alloy OTLP collector next door: the senders it exists for are
        # ephemeral processes outside this cluster (Claude Code on the
        # workstation and in the homelab-agent job runner), so there is nothing
        # long-lived for Prometheus to scrape -- they push, Alloy receives, and
        # this is the door it hands the samples through.
        #
        # This only opens the in-cluster Service. Nothing routes /api/v1/write
        # from the internal gateway, so the write path is not reachable from
        # the LAN.
        enableRemoteWriteReceiver: true

        # Resource limits
        # The limit of 8Gi exceeded the 7307Mi allocatable on any single node, so
        # the cgroup could never cap Prometheus -- the node ran out of memory first
        # (down to 10-12% available), starving the kubelet and making whichever node
        # hosts Prometheus the one that flaps. Observed usage: p99 3.93Gi (7d),
        # peak 4.23Gi (7d), peak 4.73Gi (30d, includes WAL replay after restarts).
        # 5.5Gi caps it below node capacity with ~16% headroom over the 30d peak.
        # The 4Gi request already covers the p99 and is left alone: raising it would
        # push the hosting node past 97% of allocatable and block scheduling.
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            cpu: 2000m
            memory: 5632Mi

        # NFS Storage
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 500Gi

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534

        # Monitor selectors - scrape everything
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false

        # Federation from main cluster via internal DNS (Pi-hole)
        # Pi-hole will resolve prometheus.kalde.in to internal gateway IP
        additionalScrapeConfigs:
          - job_name: 'federate-main-cluster'
            scrape_interval: 60s
            scrape_timeout: 45s
            honor_labels: true
            metrics_path: '/federate'
            params:
              # Federate only what this cluster actually consumes. '{job=~".+"}'
              # pulled the main cluster's entire TSDB (433k series, 75% of ours);
              # apiserver_request_duration_seconds_bucket alone was 27k series that
              # no rule or dashboard reads. This allowlist keeps ~63k series.
              # NOTE: these selectors are evaluated by the MAIN cluster's Prometheus
              # against ITS label values, so the job name here is 'node-exporter',
              # not the 'main-nodes' that metric_relabel_configs renames it to
              # below. For the same reason nothing here can match on cluster="main",
              # which is attached locally via static_configs.
              'match[]':
                # Whole jobs -- cheap, and feed both dashboards and alerts.
                - '{job="kube-state-metrics"}'
                - '{job="node-exporter"}'
                # Target liveness for every main-cluster component (KubeAPIDown,
                # KubeletDown, NodeDown, ...).
                - '{__name__="up"}'
                # Control-plane alerting: this cluster is the only alerting for
                # main, so the apiserver/kubelet metrics the default rules read
                # must keep flowing -- but only those, not the whole job.
                - '{__name__=~"apiserver_client_certificate_expiration_seconds_bucket|apiserver_client_certificate_expiration_seconds_count|apiserver_request_sli_duration_seconds_bucket|apiserver_request_sli_duration_seconds_count|apiserver_request_terminations_total|apiserver_request_total"}'
                - '{__name__=~"kubelet_certificate_manager_client_expiration_renew_errors|kubelet_certificate_manager_client_ttl_seconds|kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_bucket|kubelet_running_pods|kubelet_volume_stats_.*"}'
                # cAdvisor series behind the pod CPU/memory panels and throttling alerts.
                - '{__name__=~"container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_usage_seconds_total|container_memory_cache|container_memory_rss|container_memory_working_set_bytes"}'
                # Assorted singles referenced by the default rules.
                - '{__name__=~"rest_client_requests_total|aggregator_unavailable_apiservice|aggregator_unavailable_apiservice_total|process_start_time_seconds|kubernetes_build_info"}'
                # Main's own Prometheus/Alertmanager health -- nothing else watches it.
                - '{__name__=~"prometheus_.*|alertmanager_.*|reloader_last_reload_successful"}'
            static_configs:
              - targets:
                  - 'prometheus.kalde.in'
                labels:
                  cluster: main
            scheme: https
            tls_config:
              insecure_skip_verify: true
            # Main cluster's node-exporter job collides with this cluster's own;
            # rename it so dashboards/alerts can target main cluster nodes distinctly
            metric_relabel_configs:
              - source_labels: [job]
                regex: node-exporter
                target_label: job
                replacement: main-nodes

    # Node exporter
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          # Rename the bundled ServiceMonitor's job (default: node-exporter) so
          # the observability cluster's own nodes are distinct from main/proxmox
          relabelings:
            - targetLabel: job
              replacement: observability-nodes
            - targetLabel: cluster
              replacement: observability
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    # Kube state metrics
    kube-state-metrics:
      fullnameOverride: kube-state-metrics

    # Alertmanager
    alertmanager:
      enabled: true
      alertmanagerSpec:
        configSecret: alertmanager-config
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    # Disable default alert rules we don't need
    defaultRules:
      disabled:
        InfoInhibitor: true
        Watchdog: true
        PrometheusOutOfOrderTimestamps: true
        # Replaced by rules/persistentvolume-alerts.yaml with an absolute
        # free-space floor to avoid noisy alerts on large shared NFS volumes.
        KubePersistentVolumeFillingUp: true

    # Disable Grafana (we'll deploy separately)
    grafana:
      enabled: false
      forceDeployDashboards: true
