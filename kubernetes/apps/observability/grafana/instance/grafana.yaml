---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: grafana
spec:
  # Pinned: plugin grafana-lokiexplore-app 2.x requires >=12.1.7 in the 12.1 line.
  # Operator default would be 12.1.0, which the plugin refuses to load on.
  version: 12.1.10

  config:
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "false"
    server:
      root_url: https://grafana.obs.kalde.in
    log:
      mode: console
      level: warn

  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi

  # Persistent storage for Grafana data
  persistentVolumeClaim:
    spec:
      storageClassName: nfs-client
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
