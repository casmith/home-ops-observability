---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana

  # Grafana Logs Drilldown - label-first log browsing without writing LogQL.
  # The operator aggregates these into GF_INSTALL_PLUGINS on the Grafana deployment.
  plugins:
    - name: grafana-lokiexplore-app
      version: "2.5.1"

  datasource:
    name: Loki
    type: loki
    access: proxy
    url: http://loki-gateway.observability.svc.cluster.local
    jsonData:
      maxLines: 1000
    editable: true
