---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-pihole
  namespace: network
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: external-dns-pihole

    domainFilters:
      - kalde.in

    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: external-dns-pihole-secret
            key: EXTERNAL_DNS_PIHOLE_PASSWORD
      - name: EXTERNAL_DNS_PIHOLE_SERVER
        value: http://192.168.8.10
      - name: EXTERNAL_DNS_PIHOLE_API_VERSION
        value: "6"

    extraArgs:
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      # Never publish AAAA into Pi-hole - this cluster has no routable IPv6,
      # and an AAAA-only answer defeats client-side address fallback. See #68.
      - --exclude-target-net=::/0

    # Only process DNSEndpoints labeled for pihole. Without this, the
    # cloudflare-labeled DNSEndpoints (ntfy-obs -> external-obs, flux-webhook)
    # were also published into Pi-hole, so LAN clients followed a CNAME chain
    # out to *.cfargotunnel.com and picked up Cloudflare's unroutable
    # placeholder ULA fd10:aec2:5dae::. See #68.
    labelFilter: external-dns.io/provider=pihole

    interval: 1m
    logLevel: info
    logFormat: text

    policy: sync
    provider: pihole

    registry: txt
    txtOwnerId: obs-cluster-pihole
    txtPrefix: obs-

    sources:
      - crd

    serviceMonitor:
      enabled: true
