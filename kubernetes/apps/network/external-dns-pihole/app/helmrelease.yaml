---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-pihole
  namespace: network
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: external-dns-pihole

    domainFilters:
      - kalde.in

    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: external-dns-pihole-secret
            key: EXTERNAL_DNS_PIHOLE_PASSWORD
      - name: EXTERNAL_DNS_PIHOLE_SERVER
        value: http://192.168.8.10
      - name: EXTERNAL_DNS_PIHOLE_API_VERSION
        value: "6"

    extraArgs:
      # LAN DNS is derived from the internal Gateway: any HTTPRoute that names
      # network/internal as a parent gets an A record at that Gateway's address
      # (192.168.10.242). Attaching a route is the whole action - there is no
      # second file to remember, which is what went wrong in #68.
      #
      # This is also what keeps Pi-hole and Cloudflare apart. cloudflare-dns
      # reads DNSEndpoint CRDs; this instance reads only Gateway-attached
      # routes, filtered to the internal Gateway. Neither can see the other's
      # records, so the labelFilter that used to do that job is gone.
      - --gateway-name=internal
      - --gateway-namespace=network
      # Targets are Gateway addresses, which are IPv4 here. Harmless, and it
      # guarantees a dual-stack Gateway could never publish an AAAA the LAN
      # cannot route.
      - --exclude-target-net=::/0

    interval: 1m
    logLevel: info
    logFormat: text

    policy: sync
    provider: pihole

    registry: txt
    txtOwnerId: obs-cluster-pihole
    txtPrefix: obs-

    # No crd source: a DNSEndpoint will NOT reach Pi-hole. Records come from
    # HTTPRoutes on the internal Gateway. To point a LAN name somewhere that
    # is not the Gateway, add the crd source back together with a labelFilter,
    # or cloudflare-dns will fight this instance over the same CRDs.
    sources:
      - gateway-httproute

    serviceMonitor:
      enabled: true
