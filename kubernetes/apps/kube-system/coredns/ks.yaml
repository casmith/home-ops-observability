---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app coredns
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/kube-system/coredns/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Cluster DNS: never block this Kustomization on a health check that itself
  # needs DNS to pass.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      APP: *app
