---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  hostnames:
    - flux-webhook-obs.kalde.in
  parentRefs:
    # External only, on purpose. GitHub delivers this webhook from the
    # internet via the tunnel, and nothing on the LAN calls it. Attaching to
    # the internal Gateway would publish a Pi-hole record for it and put a
    # reconciliation trigger on the LAN for no caller.
    - name: external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: notification-controller
          port: 80
